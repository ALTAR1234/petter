<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Petter</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #name { position: fixed; display: none; padding: 7px 10px; border-radius: 12px; background: rgb(20 18 30 / .95); box-shadow: 0 8px 24px rgb(0 0 0 / .4), inset 0 0 0 1px rgb(255 255 255 / .12); }
    #name input { width: 150px; border: 0; background: none; outline: none; color: #fff; font: 700 14px 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <form id="name"><input maxlength="16" placeholder="Name your pet" /></form>
  <script type="module" src="pet.js"></script>
</body>
</html>
